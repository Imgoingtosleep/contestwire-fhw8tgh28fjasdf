# ==============================================================================
# Nginx Reverse Proxy Configuration (Production with Custom Domain)
# ==============================================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com api.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (เมื่อติดตั้ง SSL แล้ว)
    # return 301 https://$host$request_uri;

    # Frontend (React App)
    location / {
        proxy_pass http://frontend:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api {
        proxy_pass http://backend:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ปรับขนาดไฟล์ที่ส่งผ่าน API
        client_max_body_size 100M;
    }
}

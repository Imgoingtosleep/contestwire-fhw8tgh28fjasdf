version: "3.9"

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: news_contest_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend API (Node.js + Express)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: news_contest_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - NODE_ENV=${NODE_ENV}
      # hot reload: nodemon ใช้ chokidar — ต้อง poll เมื่อ bind mount ข้ามระบบไฟล์
      - CHOKIDAR_USEPOLLING=${WATCH_POLLING}
      - CHOKIDAR_INTERVAL=${WATCH_INTERVAL}
    ports:
      - "${BACKEND_PORT}:${PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Frontend (React)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: news_contest_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${FRONTEND_PORT}
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_SITE_NAME=${REACT_APP_SITE_NAME}
      # hot reload: webpack-dev-server (CRA 5) — WATCHPACK สำหรับ webpack, CHOKIDAR สำหรับ dev server
      - WATCHPACK_POLLING=${WATCH_POLLING}
      - CHOKIDAR_USEPOLLING=${WATCH_POLLING}
      - CHOKIDAR_INTERVAL=${WATCH_INTERVAL}
      - FAST_REFRESH=true
      # พอร์ตของ HMR websocket ต้องตรงกับพอร์ตที่ map ออกมา ไม่งั้นเบราว์เซอร์ต่อไม่ติด
      - WDS_SOCKET_PORT=${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true

volumes:
  postgres_data:
